name: Python CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Detect dependency file
        id: detect
        run: |
          if [ -f "pyproject.toml" ]; then
            echo "deps=pyproject" >> $GITHUB_OUTPUT
          elif [ -f "requirements.txt" ]; then
            echo "deps=requirements" >> $GITHUB_OUTPUT
          elif [ -f "setup.py" ]; then
            echo "deps=setup" >> $GITHUB_OUTPUT
          else
            echo "deps=none" >> $GITHUB_OUTPUT
          fi

      - name: Install dependencies (pyproject.toml)
        if: steps.detect.outputs.deps == 'pyproject'
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,dashboard,metrics,stress,messaging]" || pip install -e ".[dev]" || pip install -e . || true
          pip install pytest pytest-cov ruff mypy || true

      - name: Install dependencies (requirements.txt)
        if: steps.detect.outputs.deps == 'requirements'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
          pip install pytest pytest-cov ruff mypy || true

      - name: Install dependencies (setup.py)
        if: steps.detect.outputs.deps == 'setup'
        run: |
          python -m pip install --upgrade pip
          pip install -e . || true
          pip install pytest pytest-cov ruff mypy || true

      - name: Lint with ruff
        run: |
          if command -v ruff &> /dev/null; then
            ruff check --output-format=github . || echo "::warning::Ruff found issues"
          else
            echo "::notice::Ruff not installed, skipping linting"
          fi

      - name: Type check with mypy
        run: |
          if command -v mypy &> /dev/null; then
            mypy . --ignore-missing-imports || echo "::warning::Mypy found type issues"
          else
            echo "::notice::Mypy not installed, skipping type checking"
          fi

      - name: Test with pytest
        run: |
          if command -v pytest &> /dev/null; then
            if [ -d "tests" ] || [ -d "test" ] || ls test_*.py 2>/dev/null | grep -q .; then
              pytest --cov=. --cov-report=xml --cov-report=term --cov-report=html || exit 1
            else
              echo "::notice::No tests directory found, skipping tests"
              exit 0
            fi
          else
            echo "::notice::Pytest not installed and no tests found, passing"
            exit 0
          fi

      - name: Upload coverage to Codecov
        if: success() && hashFiles('coverage.xml') != ''
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
          flags: unittests
          name: codecov-${{ matrix.python-version }}

  # Activation audit (#93): define the package output and build it on every
  # green run. The wheel + sdist are uploaded as a workflow artifact so any
  # green commit on main is directly installable; the installed wheel is
  # smoke-checked via the `titan` console script before upload.
  package:
    name: Build distributable package
    runs-on: ubuntu-24.04
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip
          pip install build
          python -m build

      - name: Smoke check installed wheel
        run: |
          python -m venv /tmp/smoke-venv
          /tmp/smoke-venv/bin/pip install --upgrade pip
          /tmp/smoke-venv/bin/pip install dist/*.whl
          /tmp/smoke-venv/bin/titan --help

      - name: Upload package artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agentic-titan-dist
          path: dist/*
          retention-days: 30
